id: vision-sampling
title: 'Vision: Sample Faster, Reason Spatially'
summary: "Compare diffusion step budgets and schedules, then test whether an explicit\
  \ scene graph helps spatial answers. Tiny 16\xD716 images, CPU only."
domain: synthetic image diffusion and spatial reasoning
knobs:
- name: task
  description: Experiment parameter task
  default: few_steps
- name: seed
  description: Experiment parameter seed
  default: 0
- name: samples
  description: Experiment parameter samples
  default: 256
- name: steps
  description: Experiment parameter steps
  default: 8
- name: reference_steps
  description: Experiment parameter reference_steps
  default: 32
columns:
- name: effect
  description: "Signed margin above this idea\u2019s preregistered target; \u2265\
    0 meets the target"
  direction: max
- name: baseline_error
  description: baseline error
  direction: min
- name: treatment_error
  description: treatment error
  direction: min
- name: coverage
  description: coverage
  direction: max
example_falsifiers:
- id: margin-negative
  description: Mean signed claim margin is negative over five eligible seeds
  when:
    column: effect
    agg: mean
    op: <
    value: 0
    min_n: 5
