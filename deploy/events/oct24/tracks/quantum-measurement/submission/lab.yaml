lab_id: masha-quantum-measurement
domain: quantum measurement simulation
research_goal: Reconstruct a small quantum measurement distribution and test whether
  calibration is worth its shot cost. CPU only; no quantum hardware.
approach: A six-qubit transverse-field Ising simulation. Computational-basis probabilities
  do not establish entanglement or quantum advantage. The exact reference is for scoring
  only; fits must use finite-shot samples.
source:
  dir: ./src/
  allowed_patterns:
  - '**/*.py'
executor:
  run_command: python3 -m experiment --config {config_path}
  smoke_command: python3 -m experiment --config {config_path} --smoke
  config_template: ../configs/default.yaml
  run_timeout_s: 180
  smoke_timeout_s: 90
metrics:
  headline:
    column: effect
    direction: max
  panels:
  - column: effect
    label: "Claim margin (\u22650)"
  - column: baseline_error
    label: Baseline Error
  - column: treatment_error
    label: Treatment Error
  - column: coverage
    label: Coverage
  constraints:
  - column: coverage
    op: '>='
    value: 1
budget:
  daily_cap_usd: 100
  total_cap_usd: 100
  sonnet_default: true
hypothesis_validation: popper
peer_review:
  enabled: true
autonomy:
  coder_enabled: false
students:
- id: correlations
  handle: Do correlations help when measurements are scarce?
  focus: "At 512 signal shots on the six-qubit Ising ground state with field 0.7,\
    \ an adjacent-qubit conditional model reduces total-variation error by at least\
    \ 10% versus independent Bernoulli fits on the same samples. Always set config.task=correlations\
    \ for your experiments. Compare the two fitted distributions against the exact\
    \ 64-outcome reference. Repeat seeds 0\u20134, then vary shots (128, 512, 2048)\
    \ and field (0.4, 0.7, 1.2). Do not train on reference probabilities."
- id: readout
  handle: Is correcting noisy measurements worth the calibration cost?
  focus: "At 512 total shots and asymmetric readout noise (0\u21921=0.04, 1\u2192\
    0=0.10), calibrated correction reduces total-variation error by at least 10% versus\
    \ uncorrected sampling. The correction arm spends 30% of its total shots on calibration.\
    \ Always set config.task=readout for your experiments. Each arm gets 512 total\
    \ shots. Estimate each qubit\u2019s calibration errors using calibration shots,\
    \ invert the estimated channel, project negative probabilities to zero and renormalize.\
    \ Compare to the exact reference over seeds 0\u20134. Repeat at 128 and 2048 shots;\
    \ report bias/variance and projection effects."
default_student_id: correlations
