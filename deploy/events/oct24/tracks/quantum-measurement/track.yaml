id: quantum-measurement
title: 'Quantum: Encode Images, Compress with Tensors'
summary: Compare amplitude and rotation-gate encodings on handwritten digits, then
  compress complex Fourier amplitudes with matrix product states. CPU simulations.
domain: quantum data encoding and tensor networks
knobs:
- name: task
  description: Experiment parameter task
  default: encoding
- name: seed
  description: Experiment parameter seed
  default: 0
- name: train_per_class
  description: Experiment parameter train_per_class
  default: 20
- name: test_per_class
  description: Experiment parameter test_per_class
  default: 10
- name: ridge
  description: Experiment parameter ridge
  default: 0.1
- name: angle_scale
  description: Experiment parameter angle_scale
  default: 0.25
- name: bond_dim
  description: Experiment parameter bond_dim
  default: 2
- name: ordering
  description: Experiment parameter ordering
  default: row_major
columns:
- name: effect
  description: "Signed margin above this idea\u2019s preregistered target; \u2265\
    0 meets the target"
  direction: max
- name: baseline_error
  description: baseline error
  direction: min
- name: treatment_error
  description: treatment error
  direction: min
- name: coverage
  description: coverage
  direction: max
example_falsifiers:
- id: margin-negative
  description: Mean signed claim margin is negative over five eligible seeds
  when:
    column: effect
    agg: mean
    op: <
    value: 0
    min_n: 5
