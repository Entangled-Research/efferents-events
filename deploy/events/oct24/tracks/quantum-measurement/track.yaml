id: quantum-measurement
title: 'Quantum: Learn from Fewer Shots'
summary: Reconstruct a small quantum measurement distribution and test whether calibration
  is worth its shot cost. CPU only; no quantum hardware.
domain: quantum measurement simulation
knobs:
- name: task
  description: Experiment parameter task
  default: correlations
- name: seed
  description: Experiment parameter seed
  default: 0
- name: qubits
  description: Experiment parameter qubits
  default: 6
- name: shots
  description: Experiment parameter shots
  default: 512
- name: field
  description: Experiment parameter field
  default: 0.7
- name: flip01
  description: Experiment parameter flip01
  default: 0.04
- name: flip10
  description: Experiment parameter flip10
  default: 0.1
- name: calibration_fraction
  description: Experiment parameter calibration_fraction
  default: 0.3
columns:
- name: effect
  description: "Signed margin above this idea\u2019s preregistered target; \u2265\
    0 meets the target"
  direction: max
- name: baseline_error
  description: baseline error
  direction: min
- name: treatment_error
  description: treatment error
  direction: min
- name: coverage
  description: coverage
  direction: max
example_falsifiers:
- id: margin-negative
  description: Mean signed claim margin is negative over five eligible seeds
  when:
    column: effect
    agg: mean
    op: <
    value: 0
    min_n: 5
