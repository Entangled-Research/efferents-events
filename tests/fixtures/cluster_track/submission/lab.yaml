lab_id: track-template
domain: synthetic

source:
  dir: ./src/
  allowed_patterns:
    - "**/*.py"
    - "**/*.yaml"

executor:
  run_command: "python3 -m stub_run --config {config_path}"
  smoke_command: "python3 -m stub_run --config {config_path} --smoke"
  config_template: ../configs/default.yaml
  run_timeout_s: 60
  smoke_timeout_s: 30
  env_passthrough: [OMP_NUM_THREADS]

metrics:
  headline:
    column: synthetic_loss
    direction: min
  panels:
    - { column: synthetic_loss, label: "Loss" }

budget:
  daily_cap_usd: 2.0
