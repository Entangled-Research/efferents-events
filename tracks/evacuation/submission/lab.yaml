lab_id: track-template
starter_version: 1
domain: multi-agent-routing
topic: congestion-aware-evacuation
approach: local-occupancy-replanning

source:
  dir: ./src/
  allowed_patterns:
    - "**/*.py"

executor:
  run_command: "python3 run_experiment.py --config {config_path}"
  smoke_command: "python3 run_experiment.py --config {config_path} --smoke"
  config_template: ../configs/default.yaml
  run_timeout_s: 30
  smoke_timeout_s: 10
  env_passthrough: [OMP_NUM_THREADS]

metrics:
  headline:
    column: evacuation_improvement_pct
    direction: max
  panels:
    - {column: baseline_median_steps, label: "Baseline median steps", direction: min}
    - {column: candidate_median_steps, label: "Candidate median steps", direction: min}
    - {column: baseline_p95_steps, label: "Baseline p95 steps", direction: min}
    - {column: candidate_p95_steps, label: "Candidate p95 steps", direction: min}
    - {column: baseline_completion_rate, label: "Baseline completion", direction: max, target: 0.95}
    - {column: candidate_completion_rate, label: "Candidate completion", direction: max, target: 0.95}
    - {column: baseline_congestion_waits, label: "Baseline congestion waits", direction: min}
    - {column: candidate_congestion_waits, label: "Candidate congestion waits", direction: min}
    - {column: candidate_reroute_count, label: "Candidate reroutes", direction: min}
  constraints:
    - {column: candidate_completion_rate, op: ">=", value: 0.95, label: "Candidate completes at least 95%"}
  bucket_axes: []
  flat_digest_epsilon: 0.01

evidence:
  comparison:
    axis: policy
    labels:
      static: "Static shortest path"
      congestion: "Congestion-aware"
    order: [static, congestion]

budget:
  daily_cap_usd: 1.0
  total_cap_usd: 2.0
  sonnet_default: true

autonomy:
  coder_enabled: true
  coder_mode: review

conference:
  enabled: false
